<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Library — Dashboard</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="dashboard-page">

    <div class="app-layout">

        <!-- Sidebar -->

        <aside class="sidebar">

            <div class="sidebar-brand">
                <div class="brand-icon small">📚</div>
                <span>Library</span>
            </div>

            <nav class="navigation">

                <a href="#books" class="nav-item active">
                    <span class="nav-icon">📚</span>
                    <span>Books</span>
                </a>

                <a href="#loans" class="nav-item">
                    <span class="nav-icon">📖</span>
                    <span>My Loans</span>
                </a>

            </nav>

            <div class="sidebar-bottom">

                <button
                    id="logoutButton"
                    class="logout-button"
                >
                    <span>↪</span>
                    Logout
                </button>

            </div>

        </aside>


        <!-- Main content -->

        <main class="main-content">

            <!-- Header -->

            <header class="topbar">

                <div>
                    <p class="eyebrow">LIBRARY MANAGEMENT</p>
                    <h1>Dashboard</h1>
                </div>

                <div class="user-area">

                    <div class="user-avatar" id="userAvatar">
                        U
                    </div>

                    <div class="user-details">
                        <strong id="userName">User</strong>
                        <span id="userEmail">user@example.com</span>
                    </div>

                </div>

            </header>


            <!-- Welcome -->

            <section class="welcome-card">

                <div>
                    <p class="welcome-label">YOUR LIBRARY</p>

                    <h2>
                        Find your next great read.
                    </h2>

                    <p>
                        Browse the collection and borrow books
                        directly from your dashboard.
                    </p>
                </div>

                <div class="welcome-icon">
                    📖
                </div>

            </section>


            <!-- Books -->

            <section id="books" class="content-section">

                <div class="section-header">

                    <div>
                        <p class="section-label">COLLECTION</p>
                        <h2>Books</h2>
                    </div>

                    <div class="book-count" id="bookCount">
                        0 books
                    </div>

                </div>


                <!-- Book search -->

                <div class="book-search">

                    <input
                        type="text"
                        id="bookSearch"
                        placeholder="Search books..."
                        autocomplete="off"
                    >

                </div>


                <div
                    id="booksGrid"
                    class="books-grid"
                >
                    <div class="loading">
                        Loading books...
                    </div>
                </div>

            </section>


            <!-- My loans -->

            <section id="loans" class="content-section">

                <div class="section-header">

                    <div>
                        <p class="section-label">YOUR ACCOUNT</p>
                        <h2>My Loans</h2>
                    </div>

                </div>

                <div
                    id="loansContainer"
                    class="loans-container"
                >
                    <div class="loading">
                        Loading your loans...
                    </div>
                </div>

            </section>

        </main>

    </div>


    <!-- Notification -->

    <div
        id="notification"
        class="notification"
    ></div>


    <script src="js/app.js"></script>

</body>
</html>
